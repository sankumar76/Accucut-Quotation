# Stage 13: Windows package (STORY-10.04, AC-8 and AC-9; ADR-015; test strategy section 10.8).
#
# Builds the Windows release zip on a Windows runner, installs it there with install.ps1, updates it with update.ps1, proves the rollback
# with a release that is broken on purpose, and runs the Pester tests of the scripts. It is the test of 10.04, 10.05 and 10.11 on the target
# operating system. STORY-10.05 adds the weekly backup task, a backup, a clear and the proof that a replaced module is never loaded by the backup scripts.
#
# Where it sits (master's ruling DL-211, AC-9):
#   - It is NOT a required check, and it sits OUTSIDE the fan-in job `Stages 1 to 11` of ci.yml. Branch protection is unchanged. It is
#     a separate workflow, so it cannot lengthen the NFR-009 path and a change to it cannot touch ci.yml.
#   - The orchestrator treats it as must-be-green on every pull request where it runs.
#
# Security rules (architecture section 8, TB-6). The repository is public, so job logs are public.
#   - The trigger is `pull_request`, never `pull_request_target`: a pull request from a fork runs without any secret and with a
#     read-only token. This workflow uses no repository secret.
#   - Third-party actions are pinned to a commit SHA.
#   - Every secret value is made inside the job (fake, throwaway, for a database and services that die with the runner), masked in the log, written only to a
#     file in the runner's temp folder, and deleted at the end. None is on a command line.
#   - WinSW and age (and Node.js, when the image's own is too old) are downloaded from the addresses in deploy/windows/tools.psd1 and refused unless
#     their SHA-256 matches.
name: Windows package

on:
  pull_request:
    branches: [master]
    paths:
      - 'deploy/**'
      - 'scripts/package-windows.ps1'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'prisma/**'
      - 'src/worker/**'
      - 'src/app/api/health/**'
      - '.env.example'
      - '.github/workflows/windows-package.yml'
  push:
    branches: [master]
  schedule:
    # Nightly, after the other nightly jobs. A Windows-only defect must not wait for the next change to deploy/windows.
    - cron: '47 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  # A run on master must finish; only a pull request run is replaced by a newer push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  PRISMA_HIDE_UPDATE_MESSAGE: '1'
  # The same pins as ci.yml. Change them in both, in a reviewed change.
  NODE_VERSION: '22'
  NPM_VERSION: '11.17.0'

jobs:
  windows-package:
    name: "Stage 13: Windows package"
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        # Windows PowerShell 5.1: the same shell as on the server (ADR-015). Not PowerShell 7.
        shell: powershell

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # npm 11.17 enforces the `allowScripts` install-script allow-list in package.json (as in ci.yml).
      - name: Use the pinned npm
        run: npm install --global "npm@$env:NPM_VERSION"

      - name: Install the packages (npm ci)
        run: npm ci

      - name: Build (npm run build)
        run: npm run build

      # ---- The two programs the package carries, checked against the pinned SHA-256 --------------------------------------
      - name: Fetch WinSW and age (pinned, checksummed)
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $tools = Import-PowerShellDataFile -LiteralPath deploy/windows/tools.psd1
          $directory = Join-Path $env:RUNNER_TEMP 'accucut-tools'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          foreach ($tool in @($tools.WinSw, $tools.Age)) {
            $file = Join-Path $directory $tool.File
            Invoke-WebRequest -Uri $tool.Url -OutFile $file -UseBasicParsing
            $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $tool.Sha256) { throw "$($tool.File) does not match its pinned SHA-256 (expected $($tool.Sha256), got $actual)." }
            Write-Host "$($tool.File) matches its pinned SHA-256."
          }
          "ACCUCUT_TOOLS=$directory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # ---- A throwaway age key pair for this run (STORY-10.05) ----------------------------------------------------------------------
      # The install is given the PUBLIC key (BACKUP_AGE_RECIPIENT); the private key stays in a file in the runner's temp folder, is masked in the log, is used only to
      # decrypt the install's own backup in the assertions, and is deleted at the end. Nothing here is a real key and nothing of it is committed.
      - name: Make a throwaway age key pair for the backups of this run
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $tools = Import-PowerShellDataFile -LiteralPath deploy/windows/tools.psd1
          $zip = Join-Path $env:ACCUCUT_TOOLS $tools.Age.File
          $folder = Join-Path $env:RUNNER_TEMP 'accucut-age-test'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zip, $folder)
          $keygen = Get-ChildItem -LiteralPath $folder -Recurse -Filter 'age-keygen.exe' | Select-Object -First 1
          if ($null -eq $keygen) { throw 'The age zip holds no age-keygen.exe.' }
          $keyFile = Join-Path $env:RUNNER_TEMP 'accucut-age-key.txt'
          # age-keygen prints a warning and the public key on standard error; Windows PowerShell 5.1 turns that into an error under 'Stop', so it is read as plain output here.
          $ErrorActionPreference = 'Continue'
          & $keygen.FullName -o $keyFile 2>$null
          $keygenCode = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($keygenCode -ne 0) { throw 'age-keygen failed.' }
          $lines = @(Get-Content -LiteralPath $keyFile)
          foreach ($line in $lines) { if ($line -like 'AGE-SECRET-KEY-*') { Write-Host "::add-mask::$($line.Trim())" } }
          $public = ($lines | Where-Object { $_ -like '# public key: *' } | Select-Object -First 1) -replace '^# public key: ', ''
          if ($public -notmatch '^age1[0-9a-z]{58}$') { throw 'age-keygen did not give a public key.' }
          "ACCUCUT_AGE_KEY=$keyFile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ACCUCUT_AGE_PUBLIC=$public" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # ---- Package -----------------------------------------------------------------------------------------------------------
      - name: Build the release package (accucut-<tag>-win-x64.zip and its SHA-256)
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $tag = "$version-$($env:GITHUB_SHA.Substring(0, 7))"
          "ACCUCUT_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & .\scripts\package-windows.ps1 -Tag $tag -ToolsDirectory $env:ACCUCUT_TOOLS -OutputDirectory dist -Commit $env:GITHUB_SHA

      # A second release of the same code under another tag, and a third that is broken on purpose, for the update and the rollback below.
      - name: Build the second and the broken release (for the update and the rollback)
        run: |
          & .\scripts\package-windows.ps1 -Tag "$($env:ACCUCUT_TAG)-u2" -ToolsDirectory $env:ACCUCUT_TOOLS -OutputDirectory dist-u2 -Commit $env:GITHUB_SHA
          & .\deploy\windows\ci\derive-release.ps1 -SourceZip "dist-u2\accucut-$($env:ACCUCUT_TAG)-u2-win-x64.zip" -Tag "$($env:ACCUCUT_TAG)-bad" -OutputDirectory dist-bad -BreakApp

      # ---- The runner's own PostgreSQL 17 ----------------------------------------------------------------------------------
      # `postgresql-x64-17` is installed but disabled on the image (user postgres, with the password that the image documents for it). It is set
      # to Manual and started, and its administrator password is replaced by a fresh invented one at once, through standard input, so that the
      # install is tested with a password that nobody could know beforehand.
      - name: Start PostgreSQL 17 and change its administrator password
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Service -Name postgresql-x64-17 -StartupType Manual
          Start-Service -Name postgresql-x64-17
          $bin = $env:PGBIN
          if (-not $bin) { $bin = 'C:\Program Files\PostgreSQL\17\bin' }
          $imageDocumentedPassword = 'root'
          $new = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 28 | ForEach-Object { [char]$_ })
          Write-Host "::add-mask::$new"
          $env:PGPASSWORD = $imageDocumentedPassword
          $ready = $false
          for ($i = 0; $i -lt 30 -and -not $ready; $i++) {
            & "$bin\pg_isready.exe" --host 127.0.0.1 --port 5432 | Out-Null
            if ($LASTEXITCODE -eq 0) { $ready = $true } else { Start-Sleep -Seconds 2 }
          }
          if (-not $ready) { throw 'PostgreSQL 17 did not become ready.' }
          "ALTER ROLE postgres PASSWORD '$new';" | & "$bin\psql.exe" --host 127.0.0.1 --port 5432 --username postgres --no-password --quiet --set ON_ERROR_STOP=1 --dbname postgres --file -
          if ($LASTEXITCODE -ne 0) { throw 'The administrator password could not be changed.' }
          Remove-Item Env:\PGPASSWORD
          $values = Join-Path $env:RUNNER_TEMP 'accucut-values.txt'
          $admin = 'Ci' + (-join ((48..57) + (65..90) + (97..122) | Get-Random -Count 14 | ForEach-Object { [char]$_ })) + '-9!'
          Write-Host "::add-mask::$admin"
          $lines = @(
            '# Invented for this run only. Deleted at the end of the job.',
            'APP_ORIGIN=http://127.0.0.1:3000',
            'ADMIN_EMAIL=ci-admin@example.test',
            "ADMIN_INITIAL_PASSWORD=$admin",
            "PG_SUPERUSER_PASSWORD=$new",
            "BACKUP_AGE_RECIPIENT=$($env:ACCUCUT_AGE_PUBLIC)",
            'SMTP_AUTH_MODE=none'
          )
          [System.IO.File]::WriteAllText($values, ($lines -join "`r`n") + "`r`n")
          "ACCUCUT_VALUES=$values" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # ---- Node.js for the services (ADR-015 Amendment 2) -------------------------------------------------------------------
      # The install runs node.exe by its FULL path, never through PATH, and refuses it unless it and its folder can be written by administrators only
      # (an MSI install gives that). The image's own copy in C:\Program Files\nodejs is used when it is 22.12 or later; otherwise the Node.js MSI that is
      # pinned in deploy/windows/tools.psd1 is installed there, after its SHA-256 has been checked.
      - name: Make sure Node.js 22.12 or later is in C:\Program Files\nodejs
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $node = 'C:\Program Files\nodejs\node.exe'
          $enough = $false
          if (Test-Path -LiteralPath $node) {
            $found = (& $node --version)
            Write-Host "The image has node.exe $found in C:\Program Files\nodejs."
            if ($found -match '^v(\d+)\.(\d+)') { $enough = ([int]$Matches[1] -gt 22) -or (([int]$Matches[1] -eq 22) -and ([int]$Matches[2] -ge 12)) }
          }
          else { Write-Host 'The image has no node.exe in C:\Program Files\nodejs.' }
          if (-not $enough) {
            $tool = (Import-PowerShellDataFile -LiteralPath deploy/windows/tools.psd1).Node
            $msi = Join-Path $env:RUNNER_TEMP $tool.File
            Invoke-WebRequest -Uri $tool.Url -OutFile $msi -UseBasicParsing
            $actual = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $tool.Sha256) { throw "$($tool.File) does not match its pinned SHA-256 (expected $($tool.Sha256), got $actual)." }
            Write-Host "$($tool.File) matches its pinned SHA-256. Installing it."
            $process = Start-Process -FilePath "$env:SystemRoot\System32\msiexec.exe" -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
            if (@(0, 3010) -notcontains $process.ExitCode) { throw "The Node.js installer failed (exit code $($process.ExitCode))." }
          }
          if (-not (Test-Path -LiteralPath $node)) { throw 'node.exe is not in C:\Program Files\nodejs.' }
          Write-Host "The services will run $(& $node --version) from $node."
          "ACCUCUT_NODE=$node" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # ---- Unpack the package, and plant a tampered module next to it (ADR-015 Amendment 2, test (i)) ---------------------------
      # install.ps1 is started from the unpacked folder, as an administrator does. A module that writes a marker file when it is loaded, and then throws,
      # is put in that folder beside the true zip. The install must never load it (the first half imports nothing; the second half loads the module from
      # the copy of the zip that it checked): the marker must not exist after the install.
      - name: Unpack the package, and plant a tampered module in the unpacked folder (test i)
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = (Resolve-Path "dist\accucut-$($env:ACCUCUT_TAG)-win-x64.zip").Path
          $package = 'C:\accucut-pkg'
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zip, $package)
          $marker = Join-Path $env:RUNNER_TEMP 'accucut-tampered-module-marker.txt'
          if (Test-Path -LiteralPath $marker) { Remove-Item -LiteralPath $marker -Force }
          $tampered = "[System.IO.File]::WriteAllText('$marker', 'the tampered module was loaded')`r`nthrow 'the tampered module was loaded'`r`n"
          [System.IO.File]::WriteAllText((Join-Path $package 'AccucutOps.psm1'), $tampered)
          "ACCUCUT_MARKER=$marker" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # ---- An existing install folder is refused, untouched (ADR-015 Amendment 2, test (iii)) -----------------------------------
      - name: Refuse an install folder that already exists, empty or not (install.ps1 -Root C:\AccucutPre, test iii)
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = (Resolve-Path "dist\accucut-$($env:ACCUCUT_TAG)-win-x64.zip").Path
          $pre = 'C:\AccucutPre'
          New-Item -ItemType Directory -Path $pre | Out-Null
          $before = (Get-Acl -LiteralPath $pre).Sddl
          $ErrorActionPreference = 'Continue'
          $output = & powershell.exe -NoProfile -File 'C:\accucut-pkg\install.ps1' -ZipPath $zip -Root $pre -NonInteractive 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          $ErrorActionPreference = 'Stop'
          if ($code -eq 0) { throw 'install.ps1 should have refused the existing folder, and it did not.' }
          if ($output -notmatch 'already exists') { throw 'The refusal does not say that the folder already exists.' }
          if (-not (Test-Path -LiteralPath $pre)) { throw 'The existing folder was removed.' }
          if (@(Get-ChildItem -LiteralPath $pre -Force).Count -ne 0) { throw 'Something was put in the existing folder.' }
          if ((Get-Acl -LiteralPath $pre).Sddl -ne $before) { throw 'The permissions of the existing folder were changed.' }
          if (Test-Path -LiteralPath $env:ACCUCUT_MARKER) { throw 'The tampered module was loaded.' }
          Remove-Item -LiteralPath $pre -Force
          Write-Host 'PASS  the existing folder was refused and left exactly as it was.'
          # The step's exit code is the last native exit code (here the expected 1 of install.ps1): reset it.
          $global:LASTEXITCODE = 0

      # The Task Scheduler operational log is off by default. It is switched on before the install so that a task that does not start leaves its reason (STORY-10.05).
      - name: Switch on the Task Scheduler operational log (for the weekly backup task)
        run: |
          & wevtutil.exe set-log Microsoft-Windows-TaskScheduler/Operational /enabled:true
          if ($LASTEXITCODE -ne 0) { Write-Host 'The operational log could not be switched on (diagnostics only).' }
          $global:LASTEXITCODE = 0

      # ADR-015 Amendment 3.2: a read-only export of the user rights BEFORE the install (secedit changes nothing), and the time the install begins. The install must add
      # AccucutBackup's SID to "Log on as a batch job" and change nothing else; the removal at the end must give the policy back exactly as it was.
      - name: Export the user rights before the install (secedit, read-only)
        run: |
          $before = Join-Path $env:RUNNER_TEMP 'rights-before.inf'
          & "$env:SystemRoot\System32\secedit.exe" /export /areas USER_RIGHTS /cfg $before | Out-Null
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $before)) { throw 'secedit could not export the user rights.' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ACCUCUT_RIGHTS_BEFORE=$before"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ('ACCUCUT_INSTALL_STARTED=' + (Get-Date).ToString('o'))
          $global:LASTEXITCODE = 0

      # ---- Install (AC-1, AC-2, AC-5, AC-6, AC-7) -------------------------------------------------------------------------
      - name: Install from the unpacked zip, non-interactively (install.ps1)
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = (Resolve-Path "dist\accucut-$($env:ACCUCUT_TAG)-win-x64.zip").Path
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -File 'C:\accucut-pkg\install.ps1' -ZipPath $zip -ValuesFile $env:ACCUCUT_VALUES -NonInteractive -DefenderExclusion Yes -NodeExe $env:ACCUCUT_NODE
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed (exit code $LASTEXITCODE)." }
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath $env:ACCUCUT_MARKER) { throw 'The tampered module in the unpacked folder was loaded by the install.' }
          Write-Host 'PASS  the tampered module next to the zip was never loaded.'
          $global:LASTEXITCODE = 0

      - name: Assert the install (services, health, sign-in, permissions, the backup account, task, files and role, no secret in a log)
        run: |
          & .\deploy\windows\ci\assert-install.ps1 -ValuesFile $env:ACCUCUT_VALUES -ExpectedRelease $env:ACCUCUT_TAG -AgeKeyFile $env:ACCUCUT_AGE_KEY -RightsBefore $env:ACCUCUT_RIGHTS_BEFORE -InstallStartedAt $env:ACCUCUT_INSTALL_STARTED

      # ---- Backup, clear and a replaced module (STORY-10.05; ADR-015 Amendments 2 and 3) ----------------------------------------------
      # backup.ps1 -Reason release as an administrator (the call update.ps1 makes), more copies, clear-copies.ps1 with its answers on standard input (a wrong date
      # removes nothing; the right one removes all but the newest 4 and leaves everything that is not provably its own), and a marker-writing module that the
      # backup scripts must never load.
      - name: Exercise backup.ps1 and clear-copies.ps1 on the real install (a backup, a clear, a replaced module)
        run: |
          $ErrorActionPreference = 'Stop'
          $marker = Join-Path $env:RUNNER_TEMP 'accucut-tampered-backup-marker.txt'
          & .\deploy\windows\ci\exercise-backup.ps1 -ValuesFile $env:ACCUCUT_VALUES -MarkerFile $marker
          if (Test-Path -LiteralPath $marker) { throw 'A tampered module was loaded by a backup script.' }
          & .\deploy\windows\ci\assert-install.ps1 -ValuesFile $env:ACCUCUT_VALUES -ExpectedRelease $env:ACCUCUT_TAG -AgeKeyFile $env:ACCUCUT_AGE_KEY -RightsBefore $env:ACCUCUT_RIGHTS_BEFORE -InstallStartedAt $env:ACCUCUT_INSTALL_STARTED

      # ---- Update and rollback (AC-3, AC-4) ----------------------------------------------------------------------------------
      # The update takes a release backup first (backup.ps1 -Reason release, through the checked wrapper); a failed or missing backup stops the update before any
      # change (update.Tests.ps1). Here the real backup runs.
      - name: Update to the second release (update.ps1)
        run: |
          $zip = (Resolve-Path "dist-u2\accucut-$($env:ACCUCUT_TAG)-u2-win-x64.zip").Path
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -File 'C:\Accucut\current\update.ps1' -ZipPath $zip
          if ($LASTEXITCODE -ne 0) { throw "update.ps1 failed (exit code $LASTEXITCODE)." }
          $ErrorActionPreference = 'Stop'
          & .\deploy\windows\ci\assert-install.ps1 -ValuesFile $env:ACCUCUT_VALUES -ExpectedRelease "$($env:ACCUCUT_TAG)-u2" -AgeKeyFile $env:ACCUCUT_AGE_KEY -RightsBefore $env:ACCUCUT_RIGHTS_BEFORE -InstallStartedAt $env:ACCUCUT_INSTALL_STARTED
          $releases = @(Get-ChildItem -LiteralPath 'C:\Accucut\releases' -Directory | Select-Object -ExpandProperty Name | Sort-Object)
          Write-Host "Releases kept: $($releases -join ', ')"
          if ($releases.Count -ne 2) { throw "Only the current and the previous release should be kept, found: $($releases -join ', ')" }

      # ADR-015 Amendment 2, test (ii): the module of the running release is made writable for ordinary users (the Users group gets write access). update.ps1
      # must refuse before it loads anything: exit code 1, the services still running, the release unchanged. The permission is removed again afterwards.
      - name: Refuse an update when a user could have changed the running module (update.ps1, test ii)
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = (Resolve-Path "dist-bad\accucut-$($env:ACCUCUT_TAG)-bad-win-x64.zip").Path
          $module = "C:\Accucut\releases\$($env:ACCUCUT_TAG)-u2\AccucutOps.psm1"
          & "$env:SystemRoot\System32\icacls.exe" $module /grant '*S-1-5-32-545:(W)' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not add the test permission.' }
          $output = ''
          $code = -1
          try {
            $ErrorActionPreference = 'Continue'
            $output = & powershell.exe -NoProfile -File 'C:\Accucut\current\update.ps1' -ZipPath $zip 2>&1 | Out-String
            $code = $LASTEXITCODE
          }
          finally {
            $ErrorActionPreference = 'Stop'
            & "$env:SystemRoot\System32\icacls.exe" $module /remove:g '*S-1-5-32-545' | Out-Null
          }
          Write-Host $output
          if ($code -ne 1) { throw "update.ps1 should have exited with code 1, and exited with $code." }
          if ($output -notmatch 'can be changed by S-1-5-32-545') { throw 'The refusal does not say that the Users group can change the module.' }
          foreach ($name in 'AccucutApp', 'AccucutWorker') {
            if ((Get-Service -Name $name).Status -ne 'Running') { throw "$name is not running." }
          }
          & .\deploy\windows\ci\assert-install.ps1 -ValuesFile $env:ACCUCUT_VALUES -ExpectedRelease "$($env:ACCUCUT_TAG)-u2" -AgeKeyFile $env:ACCUCUT_AGE_KEY -RightsBefore $env:ACCUCUT_RIGHTS_BEFORE -InstallStartedAt $env:ACCUCUT_INSTALL_STARTED

      - name: Update to a broken release, and see it rolled back (update.ps1)
        run: |
          $zip = (Resolve-Path "dist-bad\accucut-$($env:ACCUCUT_TAG)-bad-win-x64.zip").Path
          $ErrorActionPreference = 'Continue'
          $output = & powershell.exe -NoProfile -File 'C:\Accucut\current\update.ps1' -ZipPath $zip -HealthTimeoutSeconds 40 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          $ErrorActionPreference = 'Stop'
          if ($code -eq 0) { throw 'The update to the broken release should have failed, and it did not.' }
          if ($output -notmatch 'Call your IT person') { throw 'The rollback did not say "Call your IT person".' }
          & .\deploy\windows\ci\assert-install.ps1 -ValuesFile $env:ACCUCUT_VALUES -ExpectedRelease "$($env:ACCUCUT_TAG)-u2" -AgeKeyFile $env:ACCUCUT_AGE_KEY -RightsBefore $env:ACCUCUT_RIGHTS_BEFORE -InstallStartedAt $env:ACCUCUT_INSTALL_STARTED

      # ---- Removal of the backup account (ADR-015 Amendment 3.2) --------------------------------------------------------------
      # The task, then the right, then the user go; the policy must be exactly as the export before the install says. This is last among the steps that need the install.
      - name: Remove the backup account, and see the policy as it was before the install
        run: |
          & .\deploy\windows\ci\assert-removal.ps1 -RightsBefore $env:ACCUCUT_RIGHTS_BEFORE

      # ---- Pester (the scripts' own tests, with prompts mocked) ---------------------------------------------------------------
      # The image holds Pester 3.4.0 and 5.9.0; the tests need 5.
      - name: Pester tests of the scripts (deploy/windows/tests)
        run: |
          Import-Module Pester -MinimumVersion 5.0.0 -Force
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = 'deploy/windows/tests'
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = 'Detailed'
          $configuration.TestResult.Enabled = $true
          $configuration.TestResult.OutputPath = 'pester-results.xml'
          Invoke-Pester -Configuration $configuration

      - name: Show the install and update logs and the services' error logs (on failure only)
        if: ${{ failure() }}
        run: |
          Get-ScheduledTaskInfo -TaskName 'Accucut weekly backup' -ErrorAction SilentlyContinue | Format-List LastRunTime, LastTaskResult
          foreach ($pattern in 'install-*.log', 'update-*.log', '*.err.log', '*.wrapper.log') {
            Get-ChildItem -LiteralPath 'C:\Accucut\logs' -Filter $pattern -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "===== $($_.Name)"
              Get-Content -LiteralPath $_.FullName -Tail 60
            }
          }

      # Why a task did not run: the right "Log on as a batch job" of the account, the failed logons (event 4625 names the reason), and the Task Scheduler's own events.
      # Nothing here prints a secret: the password is held by Task Scheduler only.
      - name: Why did the weekly backup task not run? (on failure only)
        if: ${{ failure() }}
        run: |
          $ErrorActionPreference = 'Continue'
          Get-ScheduledTask -TaskName 'Accucut weekly backup' -ErrorAction SilentlyContinue | Format-List TaskName, State, @{ n = 'User'; e = { $_.Principal.UserId } }, @{ n = 'LogonType'; e = { $_.Principal.LogonType } }, @{ n = 'RunLevel'; e = { $_.Principal.RunLevel } }
          Get-ScheduledTaskInfo -TaskName 'Accucut weekly backup' -ErrorAction SilentlyContinue | Format-List LastRunTime, LastTaskResult, NextRunTime, NumberOfMissedRuns
          $user = Get-LocalUser -Name 'AccucutBackup' -ErrorAction SilentlyContinue
          if ($user) { Write-Host "AccucutBackup: enabled=$($user.Enabled) sid=$($user.SID.Value)" }
          $rights = Join-Path $env:RUNNER_TEMP 'user-rights.inf'
          & "$env:SystemRoot\System32\secedit.exe" /export /cfg $rights /areas USER_RIGHTS | Out-Null
          if (Test-Path -LiteralPath $rights) { Get-Content -LiteralPath $rights | Where-Object { $_ -match 'SeBatchLogonRight|SeDenyBatchLogonRight' } }
          Get-WinEvent -FilterHashtable @{ LogName = 'Security'; Id = 4625 } -MaxEvents 3 -ErrorAction SilentlyContinue | ForEach-Object { ($_.Message -split "`n" | Where-Object { $_ -match 'Account Name|Failure Reason|Status|Sub Status|Logon Type' }) -join ' | ' }
          Get-WinEvent -LogName 'Microsoft-Windows-TaskScheduler/Operational' -MaxEvents 25 -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'Accucut' } | ForEach-Object { "$($_.TimeCreated) id=$($_.Id) $($_.Message -replace '\s+', ' ')" }
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'Accucut' } -MaxEvents 5 -ErrorAction SilentlyContinue | ForEach-Object { "$($_.TimeCreated) id=$($_.Id) $($_.Properties[0].Value)" }
          $global:LASTEXITCODE = 0

      - name: Delete the values file and the throwaway private key
        if: ${{ always() }}
        run: |
          if ($env:ACCUCUT_VALUES -and (Test-Path -LiteralPath $env:ACCUCUT_VALUES)) { Remove-Item -LiteralPath $env:ACCUCUT_VALUES -Force }
          if ($env:ACCUCUT_AGE_KEY -and (Test-Path -LiteralPath $env:ACCUCUT_AGE_KEY)) { Remove-Item -LiteralPath $env:ACCUCUT_AGE_KEY -Force }

      # The zip and its checksum hold code and tools only, no data and no setting (the package script refuses a .env file).
      - name: Keep the release package and the Pester results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accucut-windows-package
          path: |
            dist/accucut-*-win-x64.zip
            dist/accucut-*-win-x64.zip.sha256
            pester-results.xml
          if-no-files-found: warn
          retention-days: 14
