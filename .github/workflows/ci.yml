# CI pipeline: stages 1 to 12 of docs/04-architecture/test-strategy.md section 10 (STORY-10.01, AC-4; stage 12 on
# since STORY-10.02; stage 11b, the NFR-009 JS budget, since STORY-10.10), stage 13 off.
#
# Stage 12 (E2E) is on since STORY-10.02, the first page story. Stage 13 (image) is present below as a
# DISABLED step until the Dockerfile story STORY-10.04 gives it something to run: change
# `if: ${{ false }}` to `if: ${{ true }}` there.
#
# Security rules (architecture section 8, TB-6). The repository is public, so job logs are public.
#   - The trigger is `pull_request`, never `pull_request_target`: a pull request from a fork runs
#     without any secret and with a read-only token.
#   - This workflow uses no repository secret and holds no production secret. The database below
#     exists only for the life of the job and its passwords are generated inside the job.
#   - Third-party actions are pinned to a commit SHA.
#
# Each stage is one step, so a failure names the stage. Steps run in order and the first failure
# stops the job, which blocks merge once the check is marked required on the base branch.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only a pull request run is cancelled by a newer push. A run on master must finish, so the commit
  # that stage 13 will check is never left without a result (STD-12).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  PRISMA_HIDE_UPDATE_MESSAGE: '1'
  # Pinned tool versions. Change them here, in a reviewed change.
  NODE_VERSION: '22'
  NPM_VERSION: '11.17.0'
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
  # Part of the Playwright system-package cache key (stage 12a). Raise it by hand, in a reviewed change, to start a new
  # key when the cached entry is bad. Never changed otherwise.
  CACHE_EPOCH: '99'

jobs:
  verify:
    # The job name is kept: it is the required status check on master. It now also runs stage 12 (E2E), so stage 12
    # blocks merge too. Renaming the job would leave master waiting for a check that never reports.
    name: Stages 1 to 11
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # PostgreSQL 17, pinned by digest (same image as compose.dev.yml; Dependabot updates only the Compose
      # file, so change both together). Bootstrap superuser only; the application roles are created in
      # stage 10. The superuser password below is a fixed throwaway for a database that exists only for this
      # job and cannot be reached from outside the runner (a service `env:` cannot read a generated value),
      # so a scanner hit on it is not a leak.
      postgres:
        image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-bootstrap-only
          POSTGRES_DB: accucut
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1 --username postgres --dbname accucut"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secret scan reads every commit; changed-code coverage reads the base branch
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # npm 11.17 enforces the `allowScripts` install-script allow-list in package.json.
      - name: Use the pinned npm
        run: npm install --global "npm@${NPM_VERSION}"

      # ---- Stage 1: install ------------------------------------------------------------------
      - name: "Stage 1: install (npm ci, prisma generate)"
        run: |
          npm ci
          npx prisma generate

      # ---- Stage 2: secret scan --------------------------------------------------------------
      - name: "Stage 2: secret scan (Gitleaks, full history)"
        run: |
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          curl -sSfL -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          echo "GITLEAKS_BIN=${RUNNER_TEMP}/gitleaks/gitleaks" >> "${GITHUB_ENV}"
          "${RUNNER_TEMP}/gitleaks/gitleaks" git --redact --no-banner --config .gitleaks.toml --baseline-path .gitleaks-baseline.json .
          # The baseline accepts exactly 7 documentation findings (delivery lead, 2026-11-02; README). It is
          # not an allow-list: any other finding fails. Negative control: with the baseline in use, the scan must
          # still fail on a fake secret built at run time (never committed).
          GITLEAKS_BIN="${RUNNER_TEMP}/gitleaks/gitleaks" npx tsx scripts/secret-scan-control.ts

      # ---- Stage 3: data-file check ----------------------------------------------------------
      - name: "Stage 3: data-file check (allow-list)"
        run: npx tsx scripts/check-data-files.ts

      # ---- Stage 4 and 5: lint and type-check ------------------------------------------------
      - name: "Stage 4: lint"
        run: npx eslint .

      - name: "Stage 5: type-check"
        run: npx tsc --noEmit

      # ---- Stage 6: unit tests with coverage of pure code ------------------------------------
      # Coverage is decided in two places (test strategy sections 10 and 11, ruling on QLT-05). This stage
      # has no database, so it measures only pure code, src/lib and scripts/lib, on unit lines. The
      # thresholds for that code (80 percent, 95 percent for the formula engine and the quantity
      # warnings, 100 percent of branches for figure-state and the password rule) are in vitest.config.ts.
      # The whole-package gate and the changed-code gate are decided at stage 11, where integration lines count.
      - name: "Stage 6: unit tests with coverage of pure code"
        run: >-
          npx vitest run tests/unit --coverage
          --coverage.include='src/lib/**/*.{ts,tsx}'
          --coverage.include='scripts/lib/**/*.ts'

      # ---- Stage 7 and 8: supply chain -------------------------------------------------------
      - name: "Stage 7: dependency audit (high and above)"
        run: npm audit --omit=dev --audit-level=high

      - name: "Stage 8: licence check (allow-list with named exceptions)"
        run: npx tsx scripts/check-licences.ts

      # ---- Stage 9: build --------------------------------------------------------------------
      # The cache is keyed on the lockfile and the sources, with the lockfile alone as the fallback, so a change to
      # one page still reuses the rest. It holds build output only (no secret, no setting), and a pull request's entries are visible to that pull request only.
      - name: "Cache the Next.js build cache"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'postcss.config.mjs') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: "Stage 9: build"
        run: |
          npx prisma generate
          npx next build
          npx tsx scripts/check-production-routes.ts

      # ---- Stage 10: migrations --------------------------------------------------------------
      - name: "Stage 10: create the two database roles (throwaway passwords)"
        run: |
          owner="o$(openssl rand -hex 16)"
          app="a$(openssl rand -hex 16)"
          echo "::add-mask::${owner}"
          echo "::add-mask::${app}"
          {
            echo "DB_OWNER_PASSWORD=${owner}"
            echo "DB_APP_PASSWORD=${app}"
            echo "MIGRATE_DATABASE_URL=postgresql://accucut_owner:${owner}@localhost:5432/accucut"
            echo "DATABASE_URL=postgresql://accucut_app:${app}@localhost:5432/accucut"
          } >> "${GITHUB_ENV}"
          PGHOST=localhost PGPASSWORD=ci-bootstrap-only POSTGRES_USER=postgres POSTGRES_DB=accucut \
            DB_OWNER_PASSWORD="${owner}" DB_APP_PASSWORD="${app}" \
            bash docker/postgres-init/01-create-roles.sh

      - name: "Stage 10: migrations on an empty database, then the drift check"
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      # ---- Stage 11: integration, contract, security, acceptance, then the combined coverage gates
      # Every Vitest level runs in one run with the full coverage scope (scripts/lib/coverage-scope.ts), so a
      # service tested only by an integration test counts as covered. The whole-package threshold is decided
      # here; src/server is never excluded. A directory that does not exist yet is ignored by the filter.
      - name: "Stage 11: integration tests against PostgreSQL, with combined coverage"
        run: npx vitest run tests/unit tests/integration tests/security tests/acceptance --coverage

      - name: "Stage 11: coverage of changed code (at least 80 percent)"
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npx tsx scripts/check-changed-coverage.ts --base "origin/${BASE_REF}"

      # ---- Stage 11b: JS budget (NFR-009, on since STORY-10.10) ------------------------------
      # Every route's first-load JavaScript, gzip level 9, is at most 200,000 bytes (test strategy section 10.1). The
      # script starts `next start` on a free port for the stage 9 build, signs in as an invented Admin where a route asks for
      # sign-in (the user is made in the job's throwaway database, after stage 10 migrated it), reads the files each page
      # names from `.next/static`, writes one row per route to the job summary, stops the server, and exits 1 if any route is
      # over its limit, does not answer as it should, or cannot be measured. It runs after stage 11 because sign-in needs the
      # migrated database, and before stage 12, which starts its own production server. The password is made in the job and
      # masked; it exists only for this database. It adds well under a minute to the job.
      - name: "Stage 11b: JS budget (NFR-009, first-load JavaScript per route)"
        run: |
          password="p$(openssl rand -hex 16)"
          echo "::add-mask::${password}"
          export MEASUREMENT_ADMIN_EMAIL="perf-admin@example.test"
          export MEASUREMENT_ADMIN_PASSWORD="${password}"
          npx tsx scripts/ensure-measurement-user.ts
          npx tsx scripts/check-js-budget.ts

      # ---- Stage 12a and 12: E2E (on since STORY-10.02, the first page story) -----------------
      # Chromium at three widths with axe (test strategy sections 2, 6, 9). Playwright starts two servers
      # (playwright.config.ts): the development server for the design-system specs and the PRODUCTION build from stage 9
      # (`next start`) for the sign-in journey (deferred issue #17). Both use this job's throwaway database through
      # `DATABASE_URL` (stage 10) and invented settings for everything else; the set-up project creates invented E2E
      # users in it.
      #
      # Stage 12a (DEF-015, AQP-206, test strategy section 10.6) installs what the browser needs, apart from the tests, so
      # the Actions API reports install time and test time separately. `playwright install --with-deps` used to run
      # apt-get against the runner's Ubuntu mirror on every run with no bound, and a slow mirror stalled the job for up to
      # ten minutes. Now:
      #   - the browser download is cached by Playwright version;
      #   - the browser's system packages (.deb files) are cached by CACHE_EPOCH, runner image and Playwright version. On a
      #     hit they are installed with dpkg and no network. On a miss, or if that install fails, apt runs with a 20 s
      #     stall timeout and 3 retries, and the step stops after 8 minutes; on a miss the packages it downloaded are saved.
      #   - a cache key is immutable and a hit is never saved again, so a bad entry is not replaced by a later run. The
      #     fallback warning prints the key and the command that removes it (`gh cache delete <key>`, run by a maintainer),
      #     or a commit that raises CACHE_EPOCH (top of this file) starts a new key. README, "Playwright install cache".
      # The caches hold downloaded packages and browser files only (no secret, no setting) and use the same pinned cache
      # action as stage 9. Caches are scoped by ref: a pull request's run restores entries from its own ref or from
      # master, and what it saves is visible to that pull request only. The entries every branch reads are written only
      # by `push` runs on master, that is by reviewed code.
      - name: "Read the Playwright and runner image versions"
        id: versions
        run: |
          playwright="$(node --print "require('@playwright/test/package.json').version")"
          {
            echo "playwright=${playwright}"
            echo "debs_key=playwright-debs-e${CACHE_EPOCH}-${ImageOS}-${ImageVersion}-${playwright}"
          } >> "${GITHUB_OUTPUT}"

      - name: "Cache the Playwright browsers"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.versions.outputs.playwright }}

      - name: "Cache the Playwright system packages"
        id: debs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/playwright-debs
          key: ${{ steps.versions.outputs.debs_key }}

      - name: "NEGATIVE CONTROL 2 (temporary, reverted): make the apt mirror unreachable, so the system-package install fails"
        run: |
          printf 'Acquire::http::Proxy "http://127.0.0.1:9";\nAcquire::https::Proxy "http://127.0.0.1:9";\n' | sudo tee /etc/apt/apt.conf.d/98-ci-break > /dev/null

      - name: "Stage 12a: Playwright browser and system packages"
        timeout-minutes: 8
        env:
          PLAYWRIGHT_DEBS_CACHE_HIT: ${{ steps.debs.outputs.cache-hit }}
          PLAYWRIGHT_DEBS_CACHE_KEY: ${{ steps.versions.outputs.debs_key }}
          PLAYWRIGHT_DEBS_DIR: ${{ runner.temp }}/playwright-debs
        run: bash scripts/ci/playwright-system-deps.sh "${PLAYWRIGHT_DEBS_DIR}"

      # Stage 12 time (AQP-199, test strategy section 10.5): `playwright.config.ts` runs four workers when `CI` is set
      # (two on a developer's machine), the set-up project warms `/`, `/queue` and `/design-system` on the development
      # server first, and tests tagged `@one-width` (tests that read no layout, in four ruled spec files) run in the
      # desktop project only. Everything else runs at all three widths. The command below carries no `--workers`,
      # `--project`, `--grep` or `--shard` flag, and it stays in this one job so the required check keeps its name.
      - name: "Stage 12: E2E (Chromium at three widths, axe)"
        run: |
          # The runner size goes to the log, so the four workers can be checked against it (AQP-199, test strategy 10.5).
          echo "Runner: $(nproc) vCPU, $(awk '/MemTotal/ {printf "%d", $2 / 1024}' /proc/meminfo) MB memory"
          npx playwright test

      # ---- Stage 13: image (DISABLED until the Dockerfile story, STORY-10.04) ----------------
      # Docker build; run it and check /api/health. Blocks merge on master only.
      - name: "Stage 13: image build and health check (disabled)"
        if: ${{ false }}
        run: echo "Enabled by STORY-10.04 together with the Dockerfile."
