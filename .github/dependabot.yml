# Dependency updates (architecture section 8, supply chain: "Dependabot on").
# Exact versions stay exact: Dependabot opens one pull request per update, and the whole CI pipeline
# (audit, licence check, tests) runs on it before a human merges. Never accept a pre-release
# (for example the `latest` tag of `prisma` points to a release candidate, see ARCH-R4).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major versions of these three stay put until after the first release (DL-119: delivery lead, 2026-11-09; the solution-architect
    # revisits them after G8). The runtime is Node 22 LTS, so `@types/node` stays on 22.x (AQP-340). Minor and patch updates still come.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
