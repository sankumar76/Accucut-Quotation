# Local development database only (STORY-10.01, AC-9). There is no deployment Compose file: the portal is
# installed on a Windows Server with deploy/windows/install.ps1 (ADR-015, STORY-10.04).
#
#   cp .env.example .env        # then replace every CHANGE_ME value
#   docker compose -f compose.dev.yml up -d db
#   npx prisma migrate deploy
#
# PostgreSQL 17, pinned by digest. To update it, pull the new tag, read the digest from
# `docker image inspect`, and change it here in a reviewed change.
#
# Mailpit (STORY-09.01, AC-9): a mail server that only captures what the portal sends, so the mail code is tested without a real mailbox.
#   docker compose -f compose.dev.yml up -d mailpit      # SMTP on 127.0.0.1:1025 (SMTP_AUTH_MODE=none), web view and HTTP API on http://127.0.0.1:8025
#   MAILPIT_API_URL=http://127.0.0.1:8025 MAILPIT_SMTP_PORT=1025 npx vitest run tests/integration/mail     # reads the messages back; without both, the tests use an in-process stub
# Pinned by version AND digest, and the same pin as the `verify` job of .github/workflows/ci.yml: change both together, in a reviewed change (DL-238).
services:
  db:
    image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
    restart: unless-stopped
    environment:
      # The image's bootstrap superuser, reachable on the private port only. The application never
      # uses it; for local development it shares the owner password so .env stays short.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD in .env}
      POSTGRES_DB: accucut
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env}
      # The role script runs the one SQL file that the Windows install reads too (deploy/db/create-roles.psql).
      ROLES_SQL: /opt/accucut/db/create-roles.psql
    ports:
      # A private port: reachable from this machine only, never from the network.
      - '127.0.0.1:55432:5432'
    volumes:
      - accucut-dev-db:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
      - ./deploy/db:/opt/accucut/db:ro
    healthcheck:
      # TCP on 127.0.0.1: during first-run initialisation the image's temporary server listens on its socket only.
      test: ['CMD-SHELL', 'pg_isready --host 127.0.0.1 --username postgres --dbname accucut']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    restart: unless-stopped
    ports:
      # Private ports: reachable from this machine only, never from the network. 1025 is the SMTP_PORT of .env.example.
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  accucut-dev-db:
